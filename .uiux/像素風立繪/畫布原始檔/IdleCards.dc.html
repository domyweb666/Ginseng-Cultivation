<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5F5F66">照像素 B-roll 的做法重排：角色有清楚的姿勢，動作前先蹲、出手只用一兩格、落定時壓扁再回彈，葉子和頭髮晚一拍跟著甩。每條 48 格、一格 0.1 秒，眨眼畫在動畫裡。</p>
