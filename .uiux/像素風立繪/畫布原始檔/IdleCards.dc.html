<!doctype html>
<html lang="zh-Hant">
<head>

<title>G 款第二版：14 張各自的待機動作</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
.lp{position:relative;overflow:hidden;background:#FFFFFF}
.lp-strip{display:block;height:100%;width:4800%;max-width:none;image-rendering:pixelated;animation:lp-play 4.8s steps(48) infinite}
.lp-eyes{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;animation:lp-blink 4s steps(1) infinite}
@keyframes lp-play{to{transform:translateX(-100%)}}
@keyframes lp-blink{0%,94%{opacity:0}95%,98%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lp-strip,.lp-eyes{animation:none !important}}
</style>
</helmet>
<div style="width: 2790px; height: 1530px; box-sizing: border-box; padding: 56px; display: flex; flex-direction: column; gap: 28px; background: #EFEBE3; color: #1D1D1F; font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 400; font-size: 48px; line-height: 1.25; color: #7A5916">G 款第二版：14 張各自的待機動作</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5F5F66">每條 48 格、一格 0.1 秒，4.8 秒一輪。平常只有呼吸、葉子、鬚和衣角在動，隔一陣子做一次招牌動作。卡片套上這次挑的七個底色。</p>
</div>

<sc-for list="{{men}}" as="c" hint-placeholder-count="7">
<div style="width: 350px; display: flex; flex-direction: column; gap: 12px">
<div style="box-sizing: border-box; width: 350px; padding: 7px; border-radius: 24px; background: {{c.bg}}; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 18px rgba(25, 22, 20, 0.10)">
<div class="lp" style="width: 336px; height: 420px; border-radius: 17px" role="img" aria-label="{{c.alt}}">
<img class="lp-strip" src="{{c.strip}}" alt="">
<sc-if value="{{c.hasEyes}}" hint-placeholder-val="{{false}}">
<img class="lp-eyes" src="{{c.eyes}}" alt="" style="animation-delay: {{c.delay}}">
</sc-if>
</div>
<div style="box-sizing: border-box; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'LXGW WenKai TC', serif; font-size: 32px; line-height: 36px; font-weight: 700; color: #FFF4D2">{{c.realm}}</div>
<div style="font-size: 13px; line-height: 18px; color: {{c.sub}}">{{c.who}}</div>
</div>
<span style="width: 34px; height: 34px; border-radius: 6px; background: #B8402F; color: #FFFFFF; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center">{{c.seal}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 6px">
<div style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #5E4410">{{c.act}}</div>
<div style="font-size: 15px; line-height: 1.55; color: #5F5F66">{{c.how}}</div>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; gap: 24px; align-items: flex-start">

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'LXGW WenKai TC', serif; font-size: 32px; line-height: 36px; font-weight: 700; color: #FFF4D2">{{c.realm}}</div>

</div>

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 6px">

<div style="font-size: 15px; line-height: 1.55; color: #5F5F66">{{c.how}}</div>
</div>
</div>
</sc-for>
</div>

</div>
</x-dc>
