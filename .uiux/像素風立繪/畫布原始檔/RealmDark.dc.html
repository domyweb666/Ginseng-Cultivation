<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>七個境界的深色卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
.lp{position:relative;overflow:hidden;background:#FFFFFF}
.lp-strip{width:100%;height:100%;background-repeat:no-repeat;background-size:4800% 100%;image-rendering:pixelated;animation:lp-play 4.8s steps(48,jump-none) infinite}
@keyframes lp-play{from{background-position:0% 0}to{background-position:100% 0}}
@media (prefers-reduced-motion:reduce){.lp-strip{animation:none !important}}
.st-r0{background-image:url(/_blob/89ee52810dc7f86a6bcf59b5fa3d9f53)}
.st-r1{background-image:url(/_blob/80110bf1a09ed7bd39e7f8454f7f984e)}
.st-r2{background-image:url(/_blob/11de902cf23135a2e9c5e2f86ab4d0f2)}
.st-r3{background-image:url(/_blob/48468dff5b626db5f69bf917fb5fab95)}
.st-r4{background-image:url(/_blob/3212ae82894a1109d366eb913ccfc682)}
.st-r5{background-image:url(/_blob/db5f7fa2af85ab22771b7604a1c1d036)}
.st-r6{background-image:url(/_blob/9112fda329491f4d0ca4aa210b000e3d)}
.st-gr0{background-image:url(/_blob/4cb19be9c8cecea95b954b802bb52d15)}
.st-gr1{background-image:url(/_blob/5583938114a9654cd15e10747a3ed14b)}
.st-gr2{background-image:url(/_blob/31a14383e1d61847d330950777dccae4)}
.st-gr3{background-image:url(/_blob/b0d2bcd7851d3ba01224371c933de8cb)}
.st-gr4{background-image:url(/_blob/a99b48e564d4884f6dc9eb5531bbc111)}
.st-gr5{background-image:url(/_blob/5ccad71b65b75cf959a922cd7027ef1c)}
.st-gr6{background-image:url(/_blob/6a11414a23a73bb8fb1addbaf4be614b)}
</style>
</helmet>
<div style="width: 5825px; height: 1500px; box-sizing: border-box; padding: 56px; display: flex; gap: 56px; background: #EFEBE3; color: #1D1D1F; font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
<sc-for list="{{phones}}" as="ph" hint-placeholder-count="9">
<div style="width: 585px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; height: 96px">
<div style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 32px; line-height: 1.3; color: #7A5916">{{ph.label}}</div>
<div style="font-size: 17px; line-height: 1.5; color: #5F5F66">{{ph.note}}</div>
</div>

<div style="position: relative; width: 585px; height: 1266px">
<div style="width: 390px; height: 844px; position: absolute; left: 0; top: 0; transform: scale(1.5); transform-origin: 0 0; overflow: hidden; background: #F7F4EC; border-radius: 44px; box-shadow: 0 0 0 1px #D9D4C8, 0 8px 22px rgba(29,29,31,0.10)">
<div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="設定" style="width: 44px; height: 44px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #7A5916">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8.5"></circle></svg>
</button>
<div style="font-family: 'LXGW WenKai TC', serif; font-size: 22px; line-height: 28px; font-weight: 700; color: #7A5916">境界</div>
<button type="button" aria-label="分析" style="width: 44px; height: 44px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #7A5916">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 2 6-6"></path></svg>
</button>
</div>

<div style="box-sizing: border-box; width: 350px; padding: 7px; border-radius: 24px; background: {{ph.cardBg}}; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 18px rgba(25, 22, 20, 0.06)">
<div class="lp" style="width: 336px; height: 420px; border-radius: 17px" role="img" aria-label="{{ph.alt}}">
<div class="lp-strip {{ph.cls}}" style="animation-delay: {{ph.delay}}"></div>
</div>
<div style="box-sizing: border-box; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 6px; font-family: 'LXGW WenKai TC', serif; color: {{ph.nameColor}}">
<span style="font-size: 32px; line-height: 36px; font-weight: 700">{{ph.realm}}</span>
<span style="font-size: 20px; line-height: 24px; font-weight: 700">{{ph.stage}}</span>
</div>
<div style="font-size: 13px; line-height: 18px; color: {{ph.subColor}}">{{ph.sub}}</div>
</div>
<span style="width: 34px; height: 34px; border-radius: 6px; background: #B8402F; color: #FFFFFF; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center">{{ph.seal}}</span>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; line-height: 20px; color: #66666D">{{ph.next}}</span>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">{{ph.need}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px" role="img" aria-label="三期進度">
<div style="height: 8px; border-radius: 999px; background: #F1E6CC; overflow: hidden"><div style="width: {{ph.p1}}; height: 8px; background: #916B1B"></div></div>
<div style="height: 8px; border-radius: 999px; background: #F1E6CC; overflow: hidden"><div style="width: {{ph.p2}}; height: 8px; background: #916B1B"></div></div>
<div style="height: 8px; border-radius: 999px; background: #F1E6CC; overflow: hidden"><div style="width: {{ph.p3}}; height: 8px; background: #916B1B"></div></div>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #F1E6CC; color: #916B1B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 13px; line-height: 18px; color: #66666D">健康 app・11 月 3 日量測</div>
<div style="font-size: 16px; line-height: 21px; font-weight: 600">{{ph.body}}</div>
</div>
<button type="button" style="min-height: 44px; padding: 0 12px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #7A5916; border-radius: 12px">手動輸入</button>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F7F4EC; border-top: 1px solid #E5E1D8; padding: 12px 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<button type="button" style="width: 100%; height: 52px; border: none; border-radius: 16px; background: #916B1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
記一筆修煉
</button>
<div style="display: flex; gap: 8px" role="img" aria-label="第 2 頁，共 3 頁">
<span style="width: 7px; height: 7px; border-radius: 999px; background: #A1A1A6"></span>
<span style="width: 18px; height: 7px; border-radius: 999px; background: #916B1B"></span>
<span style="width: 7px; height: 7px; border-radius: 999px; background: #A1A1A6"></span>
</div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
