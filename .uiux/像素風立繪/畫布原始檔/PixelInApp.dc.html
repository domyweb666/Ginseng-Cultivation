<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>像素立繪放進 app 的樣子</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
.pp{position:relative;overflow:hidden;background:#FFFFFF}
.pp-bob{position:absolute;left:0;top:0;width:100%;height:100%}
.pp-img{display:block;width:100%;height:100%;image-rendering:pixelated}
.pp-blink{position:absolute;left:0;top:0;opacity:0;animation:pp-blink 4s steps(1) infinite}
.pp-glow{position:absolute;left:79.2%;top:27.5%;width:28%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(rgba(255,236,160,.95),rgba(255,214,110,.45) 45%,rgba(255,214,110,0) 70%);mix-blend-mode:screen;animation:pp-glow 1.8s steps(1) infinite}
.pp-tw{position:absolute;width:1.786%;aspect-ratio:3/1;background:#FFE27A;animation:pp-tw 1.4s steps(1) infinite}
.pp-tw::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:inherit;transform:rotate(90deg)}
.pp-mote{position:absolute;width:.5952%;aspect-ratio:1;background:#FFF1B0;outline:1px solid rgba(242,193,78,.5);animation:pp-rise 3s steps(12) infinite}
@keyframes pp-bob{0%{transform:translateY(.952%)}12%{transform:translateY(.476%)}24%{transform:translateY(0)}36%{transform:translateY(-.476%)}48%{transform:translateY(-.952%)}60%{transform:translateY(-.476%)}72%{transform:translateY(0)}84%{transform:translateY(.476%)}96%,100%{transform:translateY(.952%)}}
@keyframes pp-blink{0%,94%{opacity:0}95%,98%{opacity:1}99%,100%{opacity:0}}
@keyframes pp-glow{0%{opacity:.35}25%{opacity:.6}50%{opacity:.9}75%{opacity:.6}100%{opacity:.35}}
@keyframes pp-tw{0%,49.99%{opacity:1}50%,100%{opacity:0}}
@keyframes pp-rise{from{margin-top:0;opacity:1}to{margin-top:-7%;opacity:0}}
@media (prefers-reduced-motion:reduce){.pp-bob,.pp-blink,.pp-glow,.pp-tw,.pp-mote{animation:none !important}}
</style>
</helmet>
<div style="width: 2620px; height: 1480px; box-sizing: border-box; padding: 56px; display: flex; gap: 56px; background: #EFEBE3; color: #1D1D1F; font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
<sc-for list="{{phones}}" as="ph" hint-placeholder-count="4">
<div style="width: 585px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; height: 76px">
<div style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 32px; line-height: 1.3; color: #7A5916">{{ph.label}}</div>
<div style="font-size: 17px; line-height: 1.5; color: #5F5F66">{{ph.note}}</div>
</div>

<div style="position: relative; width: 585px; height: 1266px">
<div style="width: 390px; height: 844px; position: absolute; left: 0; top: 0; transform: scale(1.5); transform-origin: 0 0; overflow: hidden; background: #F7F4EC; border-radius: 44px; box-shadow: 0 0 0 1px #D9D4C8, 0 8px 22px rgba(29,29,31,0.10)">
<div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="設定" style="width: 44px; height: 44px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #7A5916">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8.5"></circle></svg>
</button>
<div style="font-family: 'LXGW WenKai TC', serif; font-size: 22px; line-height: 28px; font-weight: 700; color: #7A5916">境界</div>
<button type="button" aria-label="分析" style="width: 44px; height: 44px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #7A5916">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 2 6-6"></path></svg>
</button>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 4px 18px rgba(25, 22, 20, 0.06)">
<div style="display: flex; gap: 16px; align-items: center">

<sc-if value="{{ph.isNow}}" hint-placeholder-val="{{false}}">
<img src="/_blob/bc235d0bb2a9640dacae2f7774d6ec96" alt="現在的金丹期水彩立繪" style="width: 112px; height: 140px; object-fit: cover; border-radius: 16px; background: #FBF7ED; flex-shrink: 0">
</sc-if>

<sc-if value="{{ph.isThin}}" hint-placeholder-val="{{false}}">
<div style="width: 118px; height: 146px; box-sizing: border-box; padding: 3px; border-radius: 16px; background: linear-gradient(150deg,#F2D680,#4E7A3A 45%,#E9C85C); flex-shrink: 0">
<div class="pp" style="width: 112px; height: 140px; border-radius: 13px" role="img" aria-label="金丹期像素立繪，細框">
<div class="pp-bob">
<img class="pp-img" src="/_blob/f3dfacadc99862e6a2d1b9f95ee52bb4" alt="">
<img class="pp-img pp-blink" src="/_blob/d40c6bd8e3aaead00ec6f73a55a2d2bf" alt="">
<div class="pp-glow"></div>
<div class="pp-tw" style="left: 66%; top: 14%"></div>
<div class="pp-tw" style="left: 92%; top: 40%; animation-delay: -0.7s"></div>
<div class="pp-mote" style="left: 14%; top: 70%"></div>
<div class="pp-mote" style="left: 86%; top: 76%; animation-delay: -1.5s"></div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ph.isCard}}" hint-placeholder-val="{{false}}">
<div style="width: 120px; box-sizing: border-box; padding: 4px; border-radius: 14px; background: linear-gradient(150deg,#F2D680,#4E7A3A 45%,#E9C85C); display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<div class="pp" style="width: 112px; height: 140px; border-radius: 10px" role="img" aria-label="金丹期像素立繪，完整小卡">
<div class="pp-bob">
<img class="pp-img" src="/_blob/f3dfacadc99862e6a2d1b9f95ee52bb4" alt="">
<img class="pp-img pp-blink" src="/_blob/d40c6bd8e3aaead00ec6f73a55a2d2bf" alt="">
<div class="pp-glow"></div>
<div class="pp-tw" style="left: 66%; top: 14%"></div>
<div class="pp-tw" style="left: 92%; top: 40%; animation-delay: -0.7s"></div>
<div class="pp-mote" style="left: 14%; top: 70%"></div>
<div class="pp-mote" style="left: 86%; top: 76%; animation-delay: -1.5s"></div>
</div>
</div>
<div style="height: 24px; box-sizing: border-box; padding: 0 4px 0 8px; display: flex; align-items: center; gap: 4px; border-radius: 7px; background: #FFFCF0">
<span style="font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 15px; line-height: 1; color: #5E4410">金丹</span>
<span style="flex: 1; font-size: 10px; color: #5F5F66">男</span>
<span style="width: 16px; height: 16px; border-radius: 3px; background: #B8402F; color: #FFFFFF; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center">參</span>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="font-size: 13px; line-height: 18px; color: #66666D">目前境界</div>
<div style="display: flex; align-items: baseline; gap: 4px; font-family: 'LXGW WenKai TC', serif; color: #7A5916">
<span style="font-size: 44px; line-height: 50px; font-weight: 700">金丹</span>
<span style="font-size: 24px; line-height: 30px; font-weight: 700">後期</span>
</div>
<div style="font-size: 15px; line-height: 20px; color: #66666D">FFMI 20.6・看得出有在練</div>
<div style="margin-top: 4px; align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #F1E6CC; color: #7A5916; font-size: 12px; line-height: 16px; font-weight: 500">根基穩固・體脂 15.0%</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; line-height: 20px; color: #66666D">下一期 元嬰初期</span>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">還差 1.3 公斤肌肉</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px" role="img" aria-label="金丹三期進度：初期、中期已過，後期走了 16%">
<div style="height: 8px; border-radius: 999px; background: #916B1B"></div>
<div style="height: 8px; border-radius: 999px; background: #916B1B"></div>
<div style="height: 8px; border-radius: 999px; background: #F1E6CC; overflow: hidden"><div style="width: 16%; height: 8px; background: #916B1B"></div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-size: 12px; line-height: 16px; color: #66666D">
<span>初期</span><span>中期</span><span style="color: #1D1D1F; font-weight: 600">後期</span>
</div>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #F1E6CC; color: #916B1B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 13px; line-height: 18px; color: #66666D">健康 app・11 月 3 日量測</div>
<div style="font-size: 16px; line-height: 21px; font-weight: 600">72.0 公斤・體脂 15.0%</div>
</div>
<button type="button" style="min-height: 44px; padding: 0 12px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #7A5916; border-radius: 12px">手動輸入</button>
</div>

<div style="background: #FBF7ED; border: 1px solid #F1E6CC; border-radius: 20px; padding: 14px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div>
<div style="font-size: 22px; line-height: 28px; font-weight: 700">3<span style="font-size: 13px; font-weight: 600"> 天</span></div>
<div style="font-size: 13px; line-height: 18px; color: #66666D">本週</div>
</div>
<div>
<div style="font-size: 22px; line-height: 28px; font-weight: 700">62<span style="font-size: 13px; font-weight: 600"> 天</span></div>
<div style="font-size: 13px; line-height: 18px; color: #66666D">累計修煉</div>
</div>
<div>
<div style="font-family: 'LXGW WenKai TC', serif; font-size: 20px; line-height: 28px; font-weight: 700; color: #7A5916">真傳弟子</div>
<div style="font-size: 13px; line-height: 18px; color: #66666D">宗門身分</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
<div style="margin: 0 4px; font-size: 20px; line-height: 25px; font-weight: 600">今天的修煉</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 0 16px">
<div style="min-height: 52px; padding: 12px 0; display: flex; align-items: center; gap: 12px">
<div style="flex: 1">
<div style="font-size: 17px; line-height: 22px"><span style="font-family: 'LXGW WenKai TC', serif; font-weight: 700">坐馬樁</span>・深蹲</div>
<div style="font-size: 13px; line-height: 18px; color: #66666D">90 公斤 × 5 下 × 3 組</div>
</div>
<span style="padding: 4px 10px; border-radius: 999px; background: #F1E6CC; color: #7A5916; font-size: 12px; font-weight: 500">大成</span>
</div>
<div style="height: 1px; background: #E5E1D8"></div>
<div style="min-height: 52px; padding: 12px 0; display: flex; align-items: center; gap: 12px">
<div style="flex: 1">
<div style="font-size: 17px; line-height: 22px"><span style="font-family: 'LXGW WenKai TC', serif; font-weight: 700">推山掌</span>・臥推</div>
<div style="font-size: 13px; line-height: 18px; color: #66666D">70 公斤 × 5 下 × 3 組</div>
</div>
<span style="padding: 4px 10px; border-radius: 999px; background: #F1E6CC; color: #7A5916; font-size: 12px; font-weight: 500">大成</span>
</div>
</div>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F7F4EC; border-top: 1px solid #E5E1D8; padding: 12px 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<button type="button" style="width: 100%; height: 52px; border: none; border-radius: 16px; background: #916B1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
記一筆修煉
</button>
<div style="display: flex; gap: 8px" role="img" aria-label="第 2 頁，共 3 頁">
<span style="width: 7px; height: 7px; border-radius: 999px; background: #A1A1A6"></span>
<span style="width: 18px; height: 7px; border-radius: 999px; background: #916B1B"></span>
<span style="width: 7px; height: 7px; border-radius: 999px; background: #A1A1A6"></span>
</div>
</div>

<sc-if value="{{ph.isSheet}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(29,29,31,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
<div style="width: 236px; box-sizing: border-box; padding: 6px; border-radius: 18px; background: linear-gradient(150deg,#F2D680,#4E7A3A 45%,#E9C85C); display: flex; flex-direction: column; gap: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.3)">
<div class="pp" style="width: 224px; height: 280px; border-radius: 12px" role="img" aria-label="金丹期像素立繪，大卡">
<div class="pp-bob">
<img class="pp-img" src="/_blob/f3dfacadc99862e6a2d1b9f95ee52bb4" alt="">
<img class="pp-img pp-blink" src="/_blob/d40c6bd8e3aaead00ec6f73a55a2d2bf" alt="">
<div class="pp-glow"></div>
<div class="pp-tw" style="left: 66%; top: 14%"></div>
<div class="pp-tw" style="left: 92%; top: 40%; animation-delay: -0.7s"></div>
<div class="pp-mote" style="left: 14%; top: 70%"></div>
<div class="pp-mote" style="left: 86%; top: 76%; animation-delay: -1.5s"></div>
</div>
</div>
<div style="height: 40px; box-sizing: border-box; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 10px; background: #FFFCF0">
<span style="font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 22px; line-height: 1; color: #5E4410">金丹</span>
<span style="flex: 1; font-size: 12px; color: #5F5F66">男・看得出有在練</span>
<span style="width: 24px; height: 24px; border-radius: 5px; background: #B8402F; color: #FFFFFF; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center">參</span>
</div>
</div>
<div style="font-size: 15px; line-height: 20px; color: #FFFFFF">點旁邊關閉</div>
</div>
</sc-if>

</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2620,"height":1480}}'>
class Component extends DCLogic {
renderVals() {
return {
phones: [
{ label: '現在：水彩立繪', note: '不會動', isNow: true, isThin: false, isCard: false, isSheet: false },
{ label: '新的：像素立繪加細框', note: '我推薦的做法。會浮動、眨眼，金丹會發光', isNow: false, isThin: true, isCard: false, isSheet: false },
{ label: '另一個選項：完整小卡', note: '外框、名牌、印章都放進境界碑', isNow: false, isThin: false, isCard: true, isSheet: false },
{ label: '點一下立繪：打開大卡', note: '接在「細框」那個做法後面', isNow: false, isThin: true, isCard: false, isSheet: true }
]
};
}
}
</script>
</body>
</html>
