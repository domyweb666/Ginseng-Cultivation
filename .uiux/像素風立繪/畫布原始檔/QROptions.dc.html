<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>QR 碼的五種擺法</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
.sc-move{height:23px;box-sizing:border-box;padding:0 6px 0 8px;display:flex;align-items:center;justify-content:space-between;border-radius:6px;background:#F7F1E1;font-size:12px;color:#1D1D1F}
.sc-move b{font-family:'LXGW WenKai TC','Kaiti TC',serif;font-weight:700;font-size:13px;color:#5E4410}
.sc-move span{font-size:11px;color:#7A5916}
.sc-stat{height:30px;box-sizing:border-box;padding:0 8px;display:flex;flex-direction:column;justify-content:center;border-radius:6px;background:#F1E6CC}
.sc-stat b{font-size:14px;line-height:15px;font-weight:700;color:#1D1D1F}
.sc-stat span{font-size:10px;line-height:13px;color:#5E4410}
.qr{display:block}
</style>
</helmet>
<div style="width: 2440px; height: 930px; box-sizing: border-box; padding: 56px; display: flex; flex-direction: column; gap: 16px; background: #EFEBE3; color: #1D1D1F; font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">

<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<path id="qr" d="M0 0h7v1h-7zM8 0h2v1h-2zM11 0h1v1h-1zM14 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM8 1h2v1h-2zM11 1h2v1h-2zM14 1h1v1h-1zM20 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM8 2h3v1h-3zM12 2h1v1h-1zM14 2h1v1h-1zM16 2h3v1h-3zM20 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM8 3h1v1h-1zM12 3h1v1h-1zM14 3h1v1h-1zM16 3h3v1h-3zM20 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM9 4h1v1h-1zM11 4h2v1h-2zM14 4h1v1h-1zM16 4h3v1h-3zM20 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM8 5h2v1h-2zM11 5h1v1h-1zM14 5h1v1h-1zM20 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h7v1h-7zM9 7h1v1h-1zM11 7h2v1h-2zM0 8h1v1h-1zM2 8h2v1h-2zM5 8h3v1h-3zM10 8h1v1h-1zM15 8h1v1h-1zM17 8h2v1h-2zM20 8h1v1h-1zM1 9h1v1h-1zM7 9h1v1h-1zM11 9h1v1h-1zM14 9h1v1h-1zM16 9h1v1h-1zM0 10h2v1h-2zM3 10h6v1h-6zM10 10h3v1h-3zM14 10h2v1h-2zM20 10h1v1h-1zM0 11h2v1h-2zM4 11h2v1h-2zM7 11h2v1h-2zM11 11h4v1h-4zM0 12h1v1h-1zM5 12h4v1h-4zM10 12h11v1h-11zM10 13h5v1h-5zM17 13h1v1h-1zM19 13h2v1h-2zM0 14h7v1h-7zM8 14h2v1h-2zM11 14h2v1h-2zM15 14h1v1h-1zM17 14h1v1h-1zM0 15h1v1h-1zM6 15h1v1h-1zM9 15h3v1h-3zM15 15h2v1h-2zM0 16h1v1h-1zM2 16h3v1h-3zM6 16h1v1h-1zM10 16h1v1h-1zM12 16h5v1h-5zM19 16h1v1h-1zM0 17h1v1h-1zM2 17h3v1h-3zM6 17h1v1h-1zM10 17h5v1h-5zM18 17h1v1h-1zM0 18h1v1h-1zM2 18h3v1h-3zM6 18h1v1h-1zM8 18h1v1h-1zM13 18h2v1h-2zM16 18h1v1h-1zM19 18h2v1h-2zM0 19h1v1h-1zM6 19h1v1h-1zM10 19h3v1h-3zM15 19h1v1h-1zM19 19h1v1h-1zM0 20h7v1h-7zM8 20h2v1h-2zM14 20h1v1h-1zM17 20h4v1h-4z"></path>
</defs>
</svg>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 400; font-size: 44px; line-height: 1.25; color: #7A5916">QR 碼的五種擺法</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #5F5F66">同一張金丹卡，只有 QR 碼的位置和樣子不一樣。最右邊兩張是一組：正面不放，放在卡背。</p>
</div>

<div style="display: flex; gap: 32px; align-items: flex-start">

<sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
<div style="width: 360px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
<div style="height: 64px; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 24px; line-height: 1.3; color: #7A5916">{{c.label}}</div>
<div style="font-size: 14px; line-height: 1.5; color: #5F5F66">{{c.note}}</div>
</div>
<div style="width: 360px; height: 640px; box-sizing: border-box; padding: 6px; border-radius: 22px; background: linear-gradient(150deg,#F2D680,#4E7A3A 45%,#E9C85C); box-shadow: 0 10px 28px rgba(29,29,31,0.2)">
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 5px 6px; border-radius: 16px; background: #FFFCF0; display: flex; flex-direction: column; gap: 5px">
<div style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 6px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 10px; line-height: 12px; color: #5F5F66">道號</span>
<span style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 22px; line-height: 24px; color: #1D1D1F">多米</span>
</div>
<span style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 22px; line-height: 1; color: #7A5916">金丹</span>
<span style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 15px; line-height: 1; color: #7A5916">後期</span>
<span style="width: 28px; height: 28px; border-radius: 5px; background: #B8402F; color: #FFFFFF; font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center">參</span>
</div>
<img src="/_blob/f3dfacadc99862e6a2d1b9f95ee52bb4" alt="金丹期像素立繪" style="display: block; width: 336px; height: 420px; border-radius: 10px; image-rendering: pixelated; background: #FFFFFF">
<div style="height: 22px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-radius: 6px; background: #5E4410; color: #FFFCF0; font-size: 12px">
<span style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 14px">真傳弟子</span>
<span>累計修煉 62 天</span>
</div>
<div style="height: 84px; display: flex; flex-direction: column; gap: 4px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<div class="sc-stat"><b>20.6</b><span>FFMI</span></div>
<div class="sc-stat"><b>15.0%</b><span>體脂</span></div>
<div class="sc-stat"><b>穩固</b><span>根基</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<div class="sc-move"><b>坐馬樁</b><span>大成</span></div>
<div class="sc-move"><b>拔山式</b><span>大成</span></div>
<div class="sc-move"><b>推山掌</b><span>大成</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<div class="sc-move"><b>托天式</b><span>小成</span></div>
<div class="sc-move"><b>挽弓式</b><span>小成</span></div>
<div class="sc-move"><b>攀雲梯</b><span>入門</span></div>
</div>
</div>

<sc-if value="{{c.plainFooter}}" hint-placeholder-val="{{true}}">
<div style="height: 36px; box-sizing: border-box; padding: 0 {{c.padR}}px 0 {{c.padL}}px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<span style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 16px; line-height: 20px; color: #7A5916">人蔘修煉</span>
<span style="font-size: 10px; line-height: 13px; color: #5F5F66">{{c.tag}}</span>
</div>
<span style="font-size: 11px; color: #5F5F66">2026.11.16</span>
</div>
</sc-if>

<sc-if value="{{c.band}}" hint-placeholder-val="{{false}}">
<div style="height: 36px; box-sizing: border-box; padding: 0 10px 0 4px; display: flex; align-items: center; gap: 8px; border-radius: 8px; background: #5E4410; color: #FFFCF0">
<div style="width: 28px; height: 28px; border-radius: 5px; background: #FFFCF0; display: flex; align-items: center; justify-content: center">
<svg class="qr" viewBox="-1.5 -1.5 24 24" width="26" height="26" role="img" aria-label="QR 碼，示意"><use href="#qr" fill="#5E4410"></use></svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 15px; line-height: 18px">人蔘修煉</span>
<span style="font-size: 10px; line-height: 12px; color: #F1E6CC">掃碼一起修煉</span>
</div>
<span style="font-size: 11px; color: #F1E6CC">2026.11.16</span>
</div>
</sc-if>

<sc-if value="{{c.qrLeft}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 6px; bottom: 5px; width: 36px; height: 36px; box-sizing: border-box; border: 1px solid #E0D3AE; border-radius: 6px; overflow: hidden">
<svg class="qr" viewBox="-1.5 -1.5 24 24" width="34" height="34" role="img" aria-label="QR 碼，示意"><use href="#qr" fill="#5E4410"></use></svg>
</div>
</sc-if>

<sc-if value="{{c.qrSeal}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 6px; bottom: 5px; width: 36px; height: 36px; box-sizing: border-box; border: 2px solid #B8402F; border-radius: 5px; overflow: hidden">
<svg class="qr" viewBox="-1.5 -1.5 24 24" width="32" height="32" role="img" aria-label="QR 碼，示意"><use href="#qr" fill="#B8402F"></use></svg>
</div>
</sc-if>

<sc-if value="{{c.qrOnArt}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 14px; bottom: 170px; width: 44px; height: 44px; box-sizing: border-box; padding: 3px; border-radius: 8px; background: #FFFCF0; box-shadow: 0 2px 8px rgba(29,29,31,0.25)">
<svg class="qr" viewBox="-1.5 -1.5 24 24" width="38" height="38" role="img" aria-label="QR 碼，示意"><use href="#qr" fill="#5E4410"></use></svg>
</div>
</sc-if>

</div>
</div>
</div>
</sc-for>

<div style="width: 360px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
<div style="height: 64px; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 24px; line-height: 1.3; color: #7A5916">五之二：卡背</div>
<div style="font-size: 14px; line-height: 1.5; color: #5F5F66">分享時一次給兩張圖，第二張是這個。QR 碼夠大，一定掃得到。</div>
</div>
<div style="width: 360px; height: 640px; box-sizing: border-box; padding: 6px; border-radius: 22px; background: linear-gradient(150deg,#F2D680,#4E7A3A 45%,#E9C85C); box-shadow: 0 10px 28px rgba(29,29,31,0.2)">
<div style="height: 100%; box-sizing: border-box; padding: 40px 24px; border-radius: 16px; background: #FFFCF0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 44px; line-height: 1.2; color: #7A5916">人蔘修煉</div>
<div style="width: 220px; height: 220px; box-sizing: border-box; padding: 10px; border: 2px solid #E0D3AE; border-radius: 16px; background: #FFFFFF">
<svg class="qr" viewBox="-1.5 -1.5 24 24" width="196" height="196" role="img" aria-label="QR 碼，示意"><use href="#qr" fill="#5E4410"></use></svg>
</div>
<div style="font-size: 17px; line-height: 1.5; color: #5F5F66">掃碼下載，一起修煉</div>
<span style="width: 44px; height: 44px; border-radius: 8px; background: #B8402F; color: #FFFFFF; font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 28px; line-height: 1; display: flex; align-items: center; justify-content: center">蔘</span>
</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2440,"height":930}}'>
class Component extends DCLogic {
renderVals() {
return {
cards: [
{ label: '一：左下落款', note: '現在的版本。QR 碼縮小，放在 app 名字左邊。',
  plainFooter: true, band: false, qrLeft: true, qrSeal: false, qrOnArt: false, padL: 46, padR: 4, tag: '掃碼一起修煉' },
{ label: '二：右下紅印', note: 'QR 碼做成紅色的印，跟右上角的境界印章一上一下呼應。',
  plainFooter: true, band: false, qrLeft: false, qrSeal: true, qrOnArt: false, padL: 4, padR: 46, tag: '掃碼一起修煉' },
{ label: '三：深色底欄', note: '最下面整條換成深棕，跟宗門身分那一條同色，QR 碼收在裡面。',
  plainFooter: false, band: true, qrLeft: false, qrSeal: false, qrOnArt: false, padL: 4, padR: 4, tag: '' },
{ label: '四：立繪角落', note: 'QR 碼疊在立繪右下角。下面的資訊區完全不受影響，但會擋到一點圖。',
  plainFooter: true, band: false, qrLeft: false, qrSeal: false, qrOnArt: true, padL: 4, padR: 4, tag: '' },
{ label: '五之一：正面不放', note: '正面最乾淨，QR 碼移到卡背（右邊那張）。',
  plainFooter: true, band: false, qrLeft: false, qrSeal: false, qrOnArt: false, padL: 4, padR: 4, tag: '' }
]
};
}
}
</script>
</body>
</html>
