<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
.lp{position:relative;overflow:hidden;background:#FFFFFF}
.lp-strip{display:block;width:1200%;height:100%;max-width:none;image-rendering:pixelated;animation:lp-play 1.68s steps(12) infinite}
.lp-eyes{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;animation:lp-blink 4s steps(1) infinite}
@keyframes lp-play{to{transform:translateX(-100%)}}
@keyframes lp-blink{0%,94%{opacity:0}95%,98%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lp-strip,.lp-eyes{animation:none !important}}
</style>
</helmet>
<div style="width: 3270px; height: 1500px; box-sizing: border-box; padding: 56px; display: flex; gap: 56px; background: #EFEBE3; color: #1D1D1F; font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
<sc-for list="{{phones}}" as="ph" hint-placeholder-count="5">
<div style="width: 585px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: baseline; gap: 4px; font-family: 'LXGW WenKai TC', serif; color: #7A5916">

<span style="font-size: 24px; line-height: 30px; font-weight: 700">後期</span>

<span>初期</span><span>中期</span><span style="color: #1D1D1F; font-weight: 600">後期</span>

<div style="height: 8px; border-radius: 999px; background: #916B1B"></div>

</div>
</div>
</div>

<sc-if value="{{ph.isB}}" hint-placeholder-val="{{false}}">
<div style="box-sizing: border-box; width: 350px; padding: 7px; border-radius: 24px; background: {{ph.frameBg}}; display: flex; flex-direction: column; gap: 6px; box-shadow: {{ph.shadow}}">

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">

<button type="button" style="width: 100%; height: 52px; border: none; border-radius: 16px; background: #916B1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600">
