[10, 13, 17, 28, 38, 42, 45].forEach(function (tx) { g[64][tx] = '#7FB04A'; });

bg.push({ x: sx, y: y, w: (x - sx) + 0.06, c: col });

}

var GLOW = ['..llll..', '.llllll.', 'llllllll', 'llllllll', 'llllllll', 'llllllll', '.llllll.', '..llll..'];

var glow = runs(GLOW, OX + 24, OY + 14, 0, 8);
var pill = runs(PILL, OX + 26, OY + 16, 0, 4);
var BLINK = ['..........yy........yy..........', '..........ee........ee..........', '..........yy........yy..........'];
var blink = runs(BLINK, OX, OY + 20, 0, 3);
this._d = {
bg: bg, clouds: clouds, spa: spa, spb: spb, motes: motes, glow: glow, pill: pill, blink: blink,
mSprout: runs(M, OX, OY, 0, 10),

};
