<div style="display: flex; gap: 28px; align-items: flex-start">
<div style="width: 96px; height: 516px; display: flex; align-items: center; justify-content: center; font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 36px; color: #7A5916">__TITLE__</div>
<sc-for list="{{__LIST__}}" as="c" hint-placeholder-count="4">
<div style="width: 350px; display: flex; flex-direction: column; gap: 12px">
<div style="box-sizing: border-box; width: 350px; padding: 7px; border-radius: 24px; background: {{c.bg}}; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 18px rgba(25, 22, 20, 0.10)">
<div class="lp" style="width: 336px; height: 420px; border-radius: 17px" role="img" aria-label="{{c.alt}}">
<img class="lp-strip" src="{{c.strip}}" alt="">
</div>
<div style="box-sizing: border-box; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 6px; font-family: 'LXGW WenKai TC', serif; color: #FFF4D2">
<span style="font-size: 32px; line-height: 36px; font-weight: 700">{{c.realm}}</span>
<span style="font-size: 20px; line-height: 24px; font-weight: 700">初期</span>
</div>
<div style="font-size: 13px; line-height: 18px; color: {{c.sub}}">{{c.ffmi}}</div>
</div>
<span style="width: 34px; height: 34px; border-radius: 6px; background: #B8402F; color: #FFFFFF; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center">{{c.seal}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 6px">
<div style="font-family: 'LXGW WenKai TC', 'Kaiti TC', serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #5E4410">{{c.label}}</div>
<div style="font-size: 15px; line-height: 1.55; color: #5F5F66; min-height: 70px">{{c.note}}</div>
<div style="display: flex; gap: 4px" role="img" aria-label="放進七境裡的樣子">
<span style="flex: 1; height: 28px; border-radius: 6px; background: {{c.s0}}; box-shadow: {{c.h0}}"></span>
<span style="flex: 1; height: 28px; border-radius: 6px; background: {{c.s1}}; box-shadow: {{c.h1}}"></span>
<span style="flex: 1; height: 28px; border-radius: 6px; background: {{c.s2}}; box-shadow: {{c.h2}}"></span>
<span style="flex: 1; height: 28px; border-radius: 6px; background: {{c.s3}}; box-shadow: {{c.h3}}"></span>
<span style="flex: 1; height: 28px; border-radius: 6px; background: {{c.s4}}; box-shadow: {{c.h4}}"></span>
<span style="flex: 1; height: 28px; border-radius: 6px; background: {{c.s5}}; box-shadow: {{c.h5}}"></span>
<span style="flex: 1; height: 28px; border-radius: 6px; background: {{c.s6}}; box-shadow: {{c.h6}}"></span>
</div>
</div>
</div>
</sc-for>
</div>
