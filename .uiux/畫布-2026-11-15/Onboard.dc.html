<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>第一次打開</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#7A5916;text-decoration:none}a:hover{color:#5E4410}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F4EC; color: #1D1D1F; font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <div style="padding: 72px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <img src="{{portrait}}" alt="{{portraitAlt}}" style="width: 104px; height: 130px; object-fit: cover; border-radius: 20px; background: #FBF7ED">
    <h1 style="margin: 8px 0 0; font-family: 'LXGW WenKai TC', serif; font-size: 34px; line-height: 41px; font-weight: 700; color: #7A5916">人蔘修煉</h1>
    <p style="margin: 0; font-size: 17px; line-height: 26px">先說你多高、男生還是女生，境界就能算。</p>
  </div>

  <div style="margin: 24px 20px 0; background: #FFFFFF; border-radius: 24px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 4px 18px rgba(25, 22, 20, 0.06)">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div id="h-label" style="font-size: 13px; line-height: 18px; color: #66666D">身高</div>
      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between" role="group" aria-labelledby="h-label">
        <button type="button" aria-label="身高減一公分" onClick="{{down}}" style="width: 52px; height: 52px; border: 0; border-radius: 999px; background: #EFEBE3; color: #1D1D1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 52px; line-height: 60px; font-weight: 700; font-variant-numeric: tabular-nums">{{h}}</span><span style="font-size: 17px; color: #66666D">公分</span></div>
        <button type="button" aria-label="身高加一公分" onClick="{{up}}" style="width: 52px; height: 52px; border: 0; border-radius: 999px; background: #EFEBE3; color: #1D1D1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>
    <div style="height: 1px; background: #E5E1D8"></div>
    <div style="display: flex; flex-direction: column; gap: 8px" role="group" aria-labelledby="s-label">
      <div id="s-label" style="font-size: 13px; line-height: 18px; color: #66666D; text-align: center">性別</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="{{male.on}}" onClick="{{male.pick}}" style="height: 52px; border: 0; border-radius: 14px; background: {{male.bg}}; color: {{male.fg}}; font: inherit; font-size: 17px; font-weight: 600">男</button>
        <button type="button" aria-pressed="{{female.on}}" onClick="{{female.pick}}" style="height: 52px; border: 0; border-radius: 14px; background: {{female.bg}}; color: {{female.fg}}; font: inherit; font-size: 17px; font-weight: 600">女</button>
      </div>
    </div>
  </div>
  <p style="margin: 12px 36px 0; font-size: 13px; line-height: 18px; color: #66666D; text-align: center">境界用身高校正過的 FFMI 算，男女各一套標準，之後可以在設定改。</p>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="height: 44px; border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 600; color: #7A5916">從健康 app 帶入身高與性別</button>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <a href="RealmEmpty.dc.html" style="height: 52px; border-radius: 16px; background: #916B1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">開始</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
      <button type="button" disabled style="height: 52px; border: 0; border-radius: 16px; background: #EFEBE3; color: #66666D; font: inherit; font-size: 17px; font-weight: 600">選好性別再開始</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { h: 174, sex: null };
  }
  renderVals() {
    const s = this.state;
    const opt = (key) => ({
      on: s.sex === key,
      bg: s.sex === key ? '#916B1B' : '#EFEBE3',
      fg: s.sex === key ? '#FFFFFF' : '#1D1D1F',
      pick: () => this.setState({ sex: key })
    });
    const female = s.sex === 'f';
    return {
      h: s.h,
      down: () => this.setState({ h: Math.max(140, s.h - 1) }),
      up: () => this.setState({ h: Math.min(210, s.h + 1) }),
      male: opt('m'),
      female: opt('f'),
      ready: s.sex !== null,
      notReady: s.sex === null,
      portrait: female ? '/_blob/8cc80b33ac81cf95aad2467dbb0dc7bd' : '/_blob/d00a7b7041ef5f6e038e3aeaeba05e15',
      portraitAlt: female ? '女弟子人蔘立繪' : '雜役服人蔘立繪'
    };
  }
}
</script>
</body>
</html>
